tema: "Ceremonias y cuidado"
orden: 2
preguntas:
  - pregunta: "¿Qué es una ceremonia de inspiración ancestral?"
    respuesta: "Un encuentro para cultivar la presencia, la gratitud y la intención, en vínculo respetuoso con la naturaleza. Contamos de qué tradición viene cada práctica, cuál es su sentido y cuáles son sus límites."
  - pregunta: "¿Se usan plantas en las ceremonias?"
    respuesta: "Algunas ceremonias incluyen plantas de origen ancestral, que no son alucinógenas ni ilícitas. Antes de inscribirte te contamos por WhatsApp cuáles son, cómo se usan y qué cuidados implican."
  - pregunta: "¿Hay contraindicaciones?"
    respuesta: "Algunas prácticas no se recomiendan en embarazo, con ciertos tratamientos o con algunas condiciones de salud. Antes de cada ceremonia conversamos contigo en privado; la web nunca te pide datos de salud."
  - pregunta: "¿Puedo retirarme si no me siento bien?"
    respuesta: "Sí. Participas libremente: puedes hacer preguntas, poner límites o retirarte en cualquier momento."
  - pregunta: "¿Esto reemplaza un tratamiento médico o psicológico?"
    respuesta: "No. Nuestras prácticas no reemplazan diagnósticos ni tratamientos. Si estás en tratamiento, no lo suspendas."
